<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Two-Column Table Form</title>


    <style>

        /* =================================
           GENERAL WEBSITE
        ================================= */

        * {
            box-sizing: border-box;
        }

        body {

            font-family: Arial, Helvetica, sans-serif;

            margin: 0;

            padding: 30px 15px;

            background:
                linear-gradient(
                    135deg,
                    #fff7ed,
                    #fffbeb,
                    #fef2f2
                );

            color: #431407;
        }


        /* =================================
           MAIN TITLE
        ================================= */

        body > h2 {

            max-width: 900px;

            margin: 0 auto 30px auto;

            padding: 30px;

            text-align: center;

            font-size: 36px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #9a3412,
                    #ea580c
                );

            border-radius: 20px;

            box-shadow:
                0 10px 25px rgba(0,0,0,0.15);
        }


        body > h2::before {

            content: "🍽️ ";

        }


        /* =================================
           FORM
        ================================= */

        #myForm {

            max-width: 1000px;

            margin: auto;
        }


        /* =================================
           TABLE
        ================================= */

        table {

            width: 80%;

            margin: 0 auto 25px auto;

            border-collapse: separate;

            border-spacing: 15px;

        }


        /* =================================
           TABLE HEADER
        ================================= */

        th {

            background:
                linear-gradient(
                    135deg,
                    #7c2d12,
                    #c2410c
                );

            color: white;

            padding: 18px;

            border-radius: 12px;

            font-size: 20px;

            text-align: center;

            border: none;
        }


        /* =================================
           FOOD CARD
        ================================= */

        td {

            background: white;

            padding: 20px;

            border-radius: 18px;

            border: none;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.08);

            vertical-align: middle;

            transition: 0.3s;
        }


        td:hover {

            transform: translateY(-5px);

            box-shadow:
                0 14px 30px rgba(0,0,0,0.13);
        }


        /* =================================
           FOOD CONTENT
        ================================= */

        .sub-col {

            display: flex;

            gap: 10px;

            align-items: center;

            flex-wrap: wrap;
        }


        /* =================================
           FOOD IMAGE
        ================================= */

        .sub-col img {

            width: 120px !important;

            height: 120px !important;

            object-fit: cover;

            border-radius: 15px;

            box-shadow:
                0 6px 15px rgba(0,0,0,0.18);

            transition: 0.3s;
        }


        .sub-col img:hover {

            transform: scale(1.05);
        }


        /* =================================
           CHECKBOX
        ================================= */

        input[type="checkbox"] {

            width: 22px;

            height: 22px;

            accent-color: #ea580c;

            cursor: pointer;
        }


        /* =================================
           TEXT INPUT
        ================================= */

        input[type="text"] {

            width: 130px;

            padding: 10px;

            border: 2px solid #fed7aa;

            border-radius: 8px;

            background: #fffaf5;

            color: #431407;

            font-size: 14px;
        }


        input[type="text"]:focus {

            outline: none;

            border-color: #f97316;

            background: white;

            box-shadow:
                0 0 0 3px rgba(249,115,22,0.12);
        }


        /* =================================
           QUANTITY
        ================================= */

        input[type="number"] {

            width: 70px !important;

            padding: 10px;

            border: 2px solid #fed7aa;

            border-radius: 8px;

            background: #fffaf5;

            text-align: center;

            font-size: 14px;
        }


        input[type="number"]:focus {

            outline: none;

            border-color: #f97316;

            box-shadow:
                0 0 0 3px rgba(249,115,22,0.12);
        }


        /* =================================
           CHOSEN MENU BUTTON
        ================================= */

        button {

            border: none;

            border-radius: 10px;

            padding: 13px 25px;

            font-size: 18px !important;

            font-weight: bold;

            cursor: pointer;

            color: white !important;

            background:
                linear-gradient(
                    135deg,
                    #ea580c,
                    #f97316
                ) !important;

            box-shadow:
                0 6px 15px rgba(234,88,12,0.25);

            transition: 0.3s;
        }


        button:hover {

            transform: translateY(-3px);

            box-shadow:
                0 10px 20px rgba(234,88,12,0.35);
        }


        /* =================================
           CHOSEN MENU TITLE
        ================================= */

        h3 {

            max-width: 1000px;

            margin: 30px auto 10px auto;

            padding: 15px;

            background:
                linear-gradient(
                    135deg,
                    #9a3412,
                    #ea580c
                ) !important;

            color: white !important;

            border-radius: 12px;

            font-size: 24px !important;

            text-align: center;
        }


        /* =================================
           TEXTAREA
        ================================= */

        textarea {

            width: 100%;

            min-height: 100px;

            margin-top: 10px;

            padding: 15px;

            border: 2px solid #fed7aa;

            border-radius: 12px;

            background: white;

            color: #431407;

            font-family: Arial, sans-serif;

            font-size: 15px;

            resize: vertical;

            box-shadow:
                0 5px 15px rgba(0,0,0,0.05);

            transition: 0.3s;
        }


        textarea:focus {

            outline: none;

            border-color: #f97316;

            box-shadow:
                0 0 0 4px rgba(249,115,22,0.12);
        }


        /* =================================
           DELIVERY ADDRESS
        ================================= */

        label {

            display: block;

            max-width: 1000px;

            margin: 25px auto 5px auto;

            font-size: 20px !important;

            color: #9a3412 !important;

            font-weight: bold;
        }


        /* =================================
           ORDER AND ADDRESS
        ================================= */

        #orderAndaddress {

            min-height: 130px;

            background: #fffaf5;
        }


        /* =================================
           SEND ORDER SECTION
        ================================= */

        .form-container {

            max-width: 650px;

            margin: 40px auto 0 auto;

            padding: 30px;

            background: white;

            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.09);
        }


        .form-container h2 {

            margin-top: 0;

            padding: 18px;

            background:
                linear-gradient(
                    135deg,
                    #7c2d12,
                    #ea580c
                ) !important;

            color: white !important;

            border-radius: 12px;

            font-size: 25px !important;
        }


        .form-container label {

            margin-top: 20px;
        }


        .form-container textarea {

            min-height: 150px;
        }


        /* =================================
           SEND BUTTON
        ================================= */

        .form-container button {

            width: 100%;

            margin-top: 10px;

            background:
                linear-gradient(
                    135deg,
                    #15803d,
                    #22c55e
                ) !important;
        }


        .form-container button:hover {

            background:
                linear-gradient(
                    135deg,
                    #166534,
                    #16a34a
                ) !important;
        }


        /* =================================
           MOBILE RESPONSIVE
        ================================= */

        @media (max-width: 700px) {

            body {

                padding: 15px 8px;
            }


            body > h2 {

                font-size: 27px;

                padding: 25px 15px;
            }


            table {

                width: 100%;

                border-spacing: 8px;
            }


            th {

                font-size: 15px;

                padding: 12px;
            }


            td {

                padding: 15px;
            }


            .sub-col {

                justify-content: center;

                flex-direction: column;

                text-align: center;
            }


            .sub-col img {

                width: 150px !important;

                height: 150px !important;
            }


            input[type="text"] {

                width: 100%;
            }


            input[type="number"] {

                width: 80px !important;
            }


            h3 {

                font-size: 20px !important;
            }


            .form-container {

                padding: 20px;

                margin-top: 30px;
            }

        }

    </style>

</head>


<body>


    <h2>Multi-Column Form</h2>


    <form id="myForm">


        <table align="center" style="width: 80%;">

            <thead>

                <tr>

                    <!-- Two Main Columns (Header spans) -->

                    <th colspan="1">
                        🍛 Main Column 1
                    </th>

                    <th colspan="1">
                        🍜 Main Column 2
                    </th>

                </tr>

            </thead>


            <tbody>

                <tr>

                    <!-- 3 Sub-columns for Main Column 1 -->

                    <td>

                        <div class="sub-col">

                            <img
                                src="menu4.jpg"
                                style="width: 100px; height: 100px"
                                alt="menu 1"
                            >

                            <input
                                type="checkbox"
                                name="chk1"
                                value="Menu 1"
                            >

                            <input
                                type="text"
                                name="txt1_a"
                                value="Fired rice"
                            >

                            <input
                                type="text"
                                name="txt1_b"
                                style="width: 70px;"
                                value="$2"
                            >

                            Quantity&nbsp;

                            <input
                                type="number"
                                id="qty"
                                min="1"
                                style="width: 70px;"
                                value="1"
                                placeholder="Quantity"
                            >

                        </div>

                    </td>


                    <!-- 3 Sub-columns for Main Column 2 -->

                    <td>

                        <div class="sub-col">

                            <img
                                src="images/TomYumKung.png"
                                style="width: 100px; height: 100px"
                                alt="menu 2"
                            >

                            <input
                                type="checkbox"
                                name="chk4"
                                value="Menu 2"
                            >

                            <input
                                type="text"
                                name="txt4_a"
                                value="Tom Yam kung (Shrimp soup"
                            >

                            <input
                                type="text"
                                name="txt4_b"
                                style="width: 70px;"
                                value="$5"
                            >

                            Quantity&nbsp;

                            <input
                                type="number"
                                id="qty"
                                min="1"
                                style="width: 70px;"
                                value="1"
                                placeholder="Quantity"
                            >

                        </div>

                    </td>

                </tr>

            </tbody>

        </table>


        <button
            type="button"
            onclick="saveToMessage()"
            style="font-size: 30px; color:Blue;"
        >
            🛒 Chosen menu
        </button>


        <div>

            <h3
                style="
                    background-color:Blue;
                    color:Yellow;
                    font-size:30px;
                    text-align:center
                "
            >
                Chosen menu item:
            </h3>

            <textarea
                id="outputMessage"
                readonly
            ></textarea>

        </div>


        <div>

            <label
                for="address"
                style="font-size:30px; color:Blue;"
            >
                📍 Delivery Address:
            </label>

            <br>

            <textarea
                id="address"
                name="address"
                required
            ></textarea>

            <br><br>

        </div>


        <label
            for="orderAndaddress"
            style="font-size:30px; color:Blue;"
        >
            🧾 Order and Address:
        </label>

        <br>

        <textarea
            id="orderAndaddress"
            name="orderAndaddress"
            required
        ></textarea>

        <br><br>

    </form>


    <!-- =================================
         SEND ORDER TO EMAIL
    ================================= -->

    <div class="form-container">

        <h2
            style="
                background-color:Blue;
                color:Yellow;
                font-size:30px;
                text-align:center
            "
        >
            📧 Send Order to Email
        </h2>


        <!-- REPLACE THE ACTION URL WITH YOUR FORMSPREE ENDPOINT -->

        <form
            action="https://formspree.io/f/mzezbdak"
            method="POST"
        >

            <label for="order">
                Your order:
            </label>


            <textarea
                id="order"
                name="order"
                placeholder="Waiting for text ..."
            ></textarea>


            <button type="submit">
                📧 Send order to Email
            </button>

        </form>

    </div>


    <script>

        function saveToMessage() {

            const form =
                document.getElementById('myForm');

            const checkboxes =
                form.querySelectorAll(
                    'input[type="checkbox"]'
                );

            let message =
                "Selected Items & Values:\n";


            checkboxes.forEach((chk) => {

                if (chk.checked) {

                    const parentDiv =
                        chk.closest('.sub-col');

                    const textInputs =
                        parentDiv.querySelectorAll(
                            'input[type="text"], input[type="number"]'
                        );

                    let textValues =
                        Array.from(textInputs)
                        .map(
                            input =>
                                input.value ||
                                input.defaultValue
                        )
                        .join(', ');

                    message +=
                        `- ${chk.value}: ${textValues}\n`;

                }

            });


            document.getElementById(
                'outputMessage'
            ).value = message;


            var text1 =
                document.getElementById(
                    "outputMessage"
                ).value;


            var text2 =
                document.getElementById(
                    "address"
                ).value;


            // 2. Concatenate them with a space in between

            // Option A: Template Literals (Recommended)

            var combined =
                text1 +
                "Delivery address : " +
                text2;


            //alert(combined);


            document.getElementById(
                'orderAndaddress'
            ).value = combined;


            const source1 =
                document.getElementById(
                    "orderAndaddress"
                );


            const sourceValue =
                source1.value;


            alert(sourceValue);


            document.getElementById(
                'order'
            ).value = sourceValue;


            // const destination1 = document.getElementById('order');


            // Updates the second textarea in real-time as you type in the first

            // source.addEventListener('input', () => {

            //    destination1.value = sourceValue;

            // });

        }

    </script>


</body>

</html>
