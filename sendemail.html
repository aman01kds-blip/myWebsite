<!DOCTYPE html>
<html lang="en">

<head>

   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <title>Save and Send Textbox</title>


   <style>

       /* =========================
          GENERAL
       ========================= */

       * {
           box-sizing: border-box;
       }

       body {
           font-family: Arial, sans-serif;

           margin: 0;
           padding: 40px 20px;

           background:
               linear-gradient(
                   135deg,
                   #fff7ed,
                   #fffbeb,
                   #fef2f2
               );

           color: #3f1d0b;
       }


       /* =========================
          MAIN CONTAINER
       ========================= */

       .form-container {

           max-width: 650px;

           margin: 0 auto 30px auto;

           background: white;

           padding: 30px;

           border-radius: 20px;

           box-shadow:
               0 10px 30px rgba(0,0,0,0.08);
       }


       /* =========================
          TITLE
       ========================= */

       h2 {

           text-align: center;

           font-size: 32px;

           color: #9a3412;

           margin-top: 0;

           margin-bottom: 10px;
       }


       h2::before {
           content: "🍽️ ";
       }


       .form-container::after {

           content:
               "We are happy to hear from you!";

           display: block;

           text-align: center;

           color: #78716c;

           font-size: 14px;

           margin-top: 10px;
       }


       /* =========================
          MESSAGE FORM
       ========================= */

       label {

           display: block;

           font-weight: bold;

           margin: 20px 0 8px 0;

           color: #431407;
       }


       textarea {

           width: 100%;

           min-height: 150px;

           margin-bottom: 10px;

           padding: 14px;

           font-family: Arial, sans-serif;

           font-size: 15px;

           border: 2px solid #fed7aa;

           border-radius: 12px;

           background: #fffaf5;

           resize: vertical;

           transition: 0.3s;
       }


       textarea:focus {

           outline: none;

           border-color: #f97316;

           box-shadow:
               0 0 0 4px rgba(249,115,22,0.12);
       }


       /* =========================
          BUTTON
       ========================= */

       button {

           padding: 12px 22px;

           background:
               linear-gradient(
                   135deg,
                   #ea580c,
                   #f97316
               );

           color: white;

           border: none;

           border-radius: 10px;

           cursor: pointer;

           font-size: 15px;

           font-weight: bold;

           box-shadow:
               0 5px 15px rgba(234,88,12,0.25);

           transition: 0.3s;
       }


       button:hover {

           transform: translateY(-2px);

           background:
               linear-gradient(
                   135deg,
                   #c2410c,
                   #ea580c
               );

           box-shadow:
               0 8px 20px rgba(234,88,12,0.35);
       }


       /* =========================
          ORDER SECTION
       ========================= */

       #dataForm {

           max-width: 650px;

           margin: 0 auto;

           background: white;

           padding: 30px;

           border-radius: 20px;

           box-shadow:
               0 10px 30px rgba(0,0,0,0.08);
       }


       #dataForm::before {

           content: "🍴 SELECT YOUR ITEMS";

           display: block;

           text-align: center;

           color: #9a3412;

           font-size: 22px;

           font-weight: bold;

           margin-bottom: 20px;
       }


       /* =========================
          TABLE
       ========================= */

       table {

           width: 100%;

           border-collapse: separate;

           border-spacing: 0;

           overflow: hidden;

           border-radius: 12px;

           border: 1px solid #fed7aa;

           background: white;
       }


       th {

           background:
               linear-gradient(
                   135deg,
                   #9a3412,
                   #ea580c
               );

           color: white;

           padding: 15px;

           text-align: center;

           font-size: 15px;
       }


       td {

           padding: 14px;

           text-align: center;

           border-bottom: 1px solid #fed7aa;

           color: #431407;
       }


       tr:last-child td {

           border-bottom: none;
       }


       tbody tr {

           transition: 0.2s;
       }


       tbody tr:hover {

           background: #fff7ed;

           transform: scale(1.01);
       }


       /* =========================
          CHECKBOX
       ========================= */

       input[type="checkbox"] {

           width: 20px;

           height: 20px;

           accent-color: #ea580c;

           cursor: pointer;
       }


       /* =========================
          DETAIL INPUT
       ========================= */

       input[type="text"] {

           width: 100%;

           padding: 10px;

           border: 2px solid #fed7aa;

           border-radius: 8px;

           background: #fffaf5;

           font-size: 14px;

           transition: 0.3s;
       }


       input[type="text"]:focus {

           outline: none;

           border-color: #f97316;

           background: white;

           box-shadow:
               0 0 0 3px rgba(249,115,22,0.1);
       }


       /* =========================
          SAVE BUTTON
       ========================= */

       #dataForm button {

           display: block;

           margin: 20px auto 0 auto;

           background:
               linear-gradient(
                   135deg,
                   #15803d,
                   #22c55e
               );

           box-shadow:
               0 5px 15px rgba(21,128,61,0.2);
       }


       #dataForm button:hover {

           background:
               linear-gradient(
                   135deg,
                   #166534,
                   #16a34a
               );
       }


       /* =========================
          SAVED MESSAGE
       ========================= */

       h3 {

           max-width: 650px;

           margin: 35px auto 10px auto;

           color: #9a3412;

           font-size: 20px;
       }


       #outputMessage {

           display: block;

           max-width: 650px;

           margin: 0 auto;

           min-height: 150px;

           background: #fff;

           border: 2px solid #fed7aa;

           box-shadow:
               0 8px 20px rgba(0,0,0,0.06);
       }


       /* =========================
          MOBILE
       ========================= */

       @media (max-width: 600px) {

           body {

               padding: 20px 10px;
           }


           .form-container,
           #dataForm {

               width: 100%;

               padding: 20px;

               border-radius: 15px;
           }


           h2 {

               font-size: 25px;
           }


           #dataForm::before {

               font-size: 18px;
           }


           table {

               font-size: 13px;
           }


           th,
           td {

               padding: 9px 5px;
           }


           input[type="text"] {

               min-width: 100px;
           }


           button {

               width: 100%;
           }


           h3 {

               padding: 0 10px;
           }


           #outputMessage {

               width: calc(100% - 20px);
           }
       }

   </style>

</head>


<body>


   <!-- =========================
        SEND MESSAGE
   ========================= -->

   <div class="form-container">

       <h2>Send Message to Email</h2>

       <!-- REPLACE THE ACTION URL WITH YOUR FORMSPREE ENDPOINT -->

       <form
           action="https://formspree.io/f/mzezbdak"
           method="POST"
       >

           <label for="message">
               Your Message:
           </label>

           <textarea
               id="message"
               name="message"
               placeholder="Type something here..."
               required
           ></textarea>

           <button type="submit">
               📧 Send to Email
           </button>

       </form>

   </div>


   <!-- =========================
        FOOD ORDER
   ========================= -->

   <form id="dataForm">

       <table border="1" cellpadding="8">

           <thead>

               <tr>

                   <th>Select</th>

                   <th>Item</th>

                   <th>Details / Value</th>

               </tr>

           </thead>


           <tbody>

               <tr>

                   <td>
                       <input
                           type="checkbox"
                           name="item"
                           value="Apple"
                       >
                   </td>

                   <td>
                       🍎 Apple
                   </td>

                   <td>

                       <input
                           type="text"
                           name="details"
                           placeholder="Enter quantity or note"
                       >

                   </td>

               </tr>


               <tr>

                   <td>
                       <input
                           type="checkbox"
                           name="item"
                           value="Banana"
                       >
                   </td>

                   <td>
                       🍌 Banana
                   </td>

                   <td>

                       <input
                           type="text"
                           name="details"
                           placeholder="Enter quantity or note"
                       >

                   </td>

               </tr>


               <tr>

                   <td>
                       <input
                           type="checkbox"
                           name="item"
                           value="Orange"
                       >
                   </td>

                   <td>
                       🍊 Orange
                   </td>

                   <td>

                       <input
                           type="text"
                           name="details"
                           placeholder="Enter quantity or note"
                       >

                   </td>

               </tr>

           </tbody>

       </table>


       <br>

       <button
           type="button"
           onclick="saveToMessage()"
       >
           💾 Save to Message
       </button>

   </form>


   <!-- =========================
        SAVED MESSAGE
   ========================= -->

   <h3>
       📝 Saved Message:
   </h3>


   <textarea
       id="outputMessage"
       rows="6"
       cols="40"
       readonly
   ></textarea>


   <!-- =========================
        JAVASCRIPT
        คงโค้ดเดิมไว้
   ========================= -->

   <script>

   function saveToMessage() {

       const rows =
           document.querySelectorAll(
               "#dataForm tbody tr"
           );

       let message =
           "Selected Items:\n";


       rows.forEach(row => {

           const checkbox =
               row.querySelector(
                   'input[type="checkbox"]'
               );

           const textbox =
               row.querySelector(
                   'input[type="text"]'
               );


           if (checkbox.checked) {

               message +=
                   `- ${checkbox.value}: ${textbox.value || "No details"}\n`;

           }

       });


       document.getElementById(
           "outputMessage"
       ).value = message;

   }

   </script>


</body>

</html>
