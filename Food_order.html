<!DOCTYPE html>
<html>

<head>

    <title>Food order</title>

    <!-- เพิ่ม CSS สำหรับตกแต่งเว็บไซต์ -->
    <style>

        /* ===== General ===== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;

            font-family: Arial, Helvetica, sans-serif;

            background: linear-gradient(
                135deg,
                #fff7ed,
                #fffbeb,
                #fef2f2
            );

            color: #333;
        }


        /* ===== Header ===== */

        h2 {
            text-align: center;

            background: linear-gradient(
                135deg,
                #dc2626,
                #f97316
            );

            color: white;

            margin: 0;
            padding: 35px 20px;

            font-size: 36px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.15);
        }


        /* ===== Topic ===== */

        body > p {
            text-align: center;

            font-size: 18px;

            color: #7c2d12;

            margin-top: 25px;
        }


        /* ===== Description ===== */

        p[style*="color:red"] {

            width: 80%;

            margin: 15px auto;

            padding: 15px;

            background: #fee2e2;

            border-left: 5px solid #dc2626;

            border-radius: 10px;

            font-weight: bold;

            text-align: center;
        }


        /* ===== Food Table ===== */

        table {

            width: 90%;

            max-width: 1000px;

            margin: 30px auto;

            border-collapse: separate;

            border-spacing: 20px;

        }


        /* ===== Food Card ===== */

        td {

            width: 50%;

            background: white;

            padding: 25px;

            text-align: center;

            border-radius: 20px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.08);

            transition: 0.3s;

            font-size: 20px;

            font-weight: bold;

            color: #431407;
        }


        /* Hover */

        td:hover {

            transform: translateY(-7px);

            box-shadow:
                0 15px 30px rgba(0, 0, 0, 0.15);

        }


        /* ===== Table Header ===== */

        th {

            background: #7c2d12;

            color: white;

            padding: 15px;

            border-radius: 10px;

            font-size: 18px;

        }


        /* ===== Food Image ===== */

        td img {

            display: block;

            width: 180px;

            height: 180px;

            object-fit: cover;

            margin: 15px auto;

            border-radius: 18px;

            box-shadow:
                0 8px 18px rgba(0, 0, 0, 0.18);

            transition: 0.3s;

        }


        /* Image Hover */

        td img:hover {

            transform: scale(1.05);

        }


        /* ===== Quantity Input ===== */

        input[type="number"] {

            width: 120px;

            padding: 10px;

            margin-top: 12px;

            border: 2px solid #fed7aa;

            border-radius: 8px;

            font-size: 15px;

            text-align: center;

            background: #fff7ed;

        }


        input[type="number"]:focus {

            outline: none;

            border-color: #f97316;

            box-shadow:
                0 0 0 3px rgba(249, 115, 22, 0.15);

        }


        /* ===== Restaurant Style ===== */

        table::before {

            content: "🍽️ OUR MENU";

        }


        /* ===== Mobile ===== */

        @media (max-width: 600px) {

            h2 {

                font-size: 28px;

                padding: 25px 15px;

            }


            table {

                width: 95%;

                border-spacing: 10px;

            }


            th {

                font-size: 14px;

            }


            td {

                display: block;

                width: 100%;

                margin-bottom: 15px;

            }


            td img {

                width: 150px;

                height: 150px;

            }


            p[style*="color:red"] {

                width: 90%;

            }

        }

    </style>

</head>


<body>

    <h2>My Food order page</h2>

    <p>Topic</p>

    <p style="color:red">
        The style is attribute of paragraph tag
    </p>


    <table>

        <tr>

            <th>Menu</th>

            <th>Menu</th>

        </tr>


        <tr>

            <td>

                Crab fried rice<br>

                <img
                    src="FAD212EC-4553-4AF8-B01B-38A1C4D61B1D.png"
                    alt="Flowers"
                    width="100"
                    height="100"
                >

                <input
                    type="number"
                    id="qty"
                    min="1"
                    value="1"
                    placeholder="Quantity"
                >

            </td>


            <td>

                Small rice noodles

            </td>

        </tr>


        <tr>

            <td>

                Crab fried rice<br>

                <img
                    src="FAD212EC-4553-4AF8-B01B-38A1C4D61B1D.png"
                    alt="Flowers"
                    width="100"
                    height="100"
                >

                <input
                    type="number"
                    id="qty"
                    min="1"
                    value="1"
                    placeholder="Quantity"
                >

            </td>


            <td>

                Small rice noodles

            </td>

        </tr>

    </table>


</body>

</html>
